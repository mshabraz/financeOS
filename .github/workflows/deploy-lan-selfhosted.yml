# Deploy to your LAN App Server when you push to main.
#
# Setup (once on the App Server PC):
#   GitHub → Repo → Settings → Actions → Runners → New self-hosted runner (Windows)
#   Default labels are usually: self-hosted, Windows, X64
#   Optional: add label financeos-lan in runner config
#
# No SSH secrets required — the job runs directly on the second PC.

name: Deploy to LAN App Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Matches default GitHub Windows self-hosted runner labels
    runs-on: self-hosted
    steps:
      - name: Checkout (runner workspace)
        uses: actions/checkout@v4
        with:
          path: _runner_checkout

      - name: Deploy to C:\FinanceOS\app
        shell: powershell
        env:
          PATH: C:\Program Files\Git\cmd;C:\Program Files\nodejs;${{ env.PATH }}
        run: |
          $env:Path = "C:\Program Files\Git\cmd;C:\Program Files\nodejs;" + $env:Path
          $deployScript = 'C:\FinanceOS\app\scripts\windows\Deploy-FinanceOS.ps1'
          if (-not (Test-Path $deployScript)) {
            Write-Error "Install App Server first: $deployScript not found"
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $deployScript -RepoPath 'C:\FinanceOS\app'

      - name: Deployment summary
        if: always()
        shell: powershell
        run: |
          $state = 'C:\FinanceOS\state\last-deploy.json'
          if (Test-Path $state) { Get-Content $state }
