# Deploy to your LAN App Server when you push to main.
#
# Setup (once on the App Server PC):
#   1. Self-hosted runner: GitHub → Settings → Actions → Runners → New (Windows)
#   2. Clone app to C:\FinanceOS\app, manual deploy works
#   3. Register deploy task (Admin PowerShell, as the user who owns git credentials):
#        cd C:\FinanceOS\app
#        powershell -ExecutionPolicy Bypass -File scripts\windows\Register-ActionsDeployTask.ps1
#
# The runner service account cannot git-pull a private repo or restart NSSM; the
# scheduled task runs Deploy-FinanceOS.ps1 as your interactive admin user.

name: Deploy to LAN App Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout (runner workspace)
        uses: actions/checkout@v4
        with:
          path: _runner_checkout

      - name: Sync repo at C:\FinanceOS\app (GITHUB_TOKEN)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:Path = "C:\Program Files\Git\cmd;C:\Program Files\nodejs;" + $env:Path
          $repo = 'C:\FinanceOS\app'
          if (-not (Test-Path $repo)) {
            Write-Error "App Server not set up: $repo missing"
          }
          $head = git -C $repo rev-parse HEAD 2>$null
          Write-Host "Before sync: $head"
          $remote = "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/mshabraz/financeOS.git"
          git -C $repo remote set-url origin $remote
          git -C $repo fetch origin main
          if ($LASTEXITCODE -ne 0) { Write-Error "git fetch failed (exit $LASTEXITCODE)" }
          git -C $repo reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { Write-Error "git reset failed (exit $LASTEXITCODE)" }
          git -C $repo remote set-url origin https://github.com/mshabraz/financeOS.git
          Write-Host "After sync: $(git -C $repo rev-parse HEAD)"

      - name: Run deploy via scheduled task
        shell: powershell
        env:
          PATH: C:\Program Files\Git\cmd;C:\Program Files\nodejs;${{ env.PATH }}
        run: |
          $env:Path = "C:\Program Files\Git\cmd;C:\Program Files\nodejs;" + $env:Path
          $helper = 'C:\FinanceOS\app\scripts\windows\Invoke-ActionsDeploy.ps1'
          if (-not (Test-Path $helper)) {
            Write-Error "Missing $helper — git pull on server then re-run workflow"
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $helper

      - name: Deployment summary
        if: always()
        shell: powershell
        run: |
          $state = 'C:\FinanceOS\state\last-deploy.json'
          if (Test-Path $state) { Get-Content $state }
          $log = 'C:\FinanceOS\logs\deploy.log'
          if (Test-Path $log) {
            Write-Host '--- deploy.log tail ---'
            Get-Content $log -Tail 12
          }
