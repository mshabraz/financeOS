# Deploy to LAN App Server on push to main (self-hosted runner on that PC).
# No manual server steps: syncs repo with GITHUB_TOKEN, then Invoke-GithubActionsDeploy.ps1
# (SYSTEM scheduled task if available, else inline build/migrate/restart).

name: Deploy to LAN App Server

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout (runner workspace)
        uses: actions/checkout@v4
        with:
          path: _runner_checkout

      - name: Sync repo at C:\FinanceOS\app
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:Path = "C:\Program Files\Git\cmd;C:\Program Files\nodejs;" + $env:Path
          $repo = 'C:\FinanceOS\app'
          if (-not (Test-Path $repo)) {
            Write-Error "App Server not set up: $repo missing"
          }
          Write-Host "Before: $(git -C $repo rev-parse HEAD 2>$null)"
          $remote = "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/mshabraz/financeOS.git"
          git -C $repo remote set-url origin $remote
          git -C $repo fetch origin main
          if ($LASTEXITCODE -ne 0) { Write-Error "git fetch failed (exit $LASTEXITCODE)" }
          git -C $repo reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { Write-Error "git reset failed (exit $LASTEXITCODE)" }
          git -C $repo remote set-url origin https://github.com/mshabraz/financeOS.git
          Write-Host "After: $(git -C $repo rev-parse HEAD)"

      - name: Build, migrate, restart
        shell: powershell
        env:
          PATH: C:\Program Files\Git\cmd;C:\Program Files\nodejs;${{ env.PATH }}
        run: |
          $env:Path = "C:\Program Files\Git\cmd;C:\Program Files\nodejs;" + $env:Path
          $helper = 'C:\FinanceOS\app\scripts\windows\Invoke-GithubActionsDeploy.ps1'
          if (-not (Test-Path $helper)) {
            Write-Error "Missing $helper after git sync"
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $helper -RepoPath 'C:\FinanceOS\app'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deployment summary
        if: always()
        shell: powershell
        run: |
          $state = 'C:\FinanceOS\state\last-deploy.json'
          if (Test-Path $state) { Get-Content $state }
          $log = 'C:\FinanceOS\logs\deploy.log'
          if (Test-Path $log) {
            Write-Host '--- deploy.log tail ---'
            Get-Content $log -Tail 15
          }
